<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ha2ked By Riven</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #00ff00;
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            position: relative;
        }
        
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }
        
        .glitch {
            font-size: 4rem;
            font-weight: 900;
            text-align: center;
            margin-top: 2rem;
            position: relative;
            color: #00ff00;
            text-shadow: 
                0 0 2px #00ff00,
                0 0 4px #00ff00;
            animation: glitch 0.3s infinite;
        }
        
        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
        }
        
        .terminal {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 10px;
            margin: 3rem auto;
            width: 80%;
            max-width: 600px;
            box-shadow: 
                0 0 20px #00ff00,
                inset 0 0 20px rgba(0, 255, 0, 0.1);
        }
        
        .terminal-header {
            background: #00ff00;
            color: #000;
            padding: 0.5rem 1rem;
            font-weight: bold;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .terminal-buttons {
            display: flex;
            gap: 5px;
        }
        
        .terminal-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff0000;
        }
        
        .terminal-button:nth-child(2) {
            background: #ffff00;
        }
        
        .terminal-button:nth-child(3) {
            background: #00ff00;
        }
        
        .terminal-content {
            padding: 1.5rem;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }
        
        .command-line {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            opacity: 0;
            animation: typeIn 0.5s forwards;
        }
        
        .command-line:nth-child(1) { animation-delay: 0.5s; }
        .command-line:nth-child(2) { animation-delay: 1s; }
        .command-line:nth-child(3) { animation-delay: 1.5s; }
        .command-line:nth-child(4) { animation-delay: 2s; }
        .command-line:nth-child(5) { animation-delay: 2.5s; }
        .command-line:nth-child(6) { animation-delay: 3s; }
        .command-line:nth-child(7) { animation-delay: 3.5s; }
        .command-line:nth-child(8) { animation-delay: 4s; }
        
        @keyframes typeIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .prompt {
            color: #ff0000;
            margin-left: 5px;
        }
        
        .command {
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        
        .status {
            color: #ffff00;
        }
        
        .cursor {
            display: inline-block;
            background: #00ff00;
            width: 10px;
            height: 20px;
            animation: blink 1s infinite;
            margin-right: 5px;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ff00, transparent);
            animation: scan 2s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ff00;
            opacity: 0.7;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { transform: translateY(-100px) rotate(180deg); opacity: 1; }
        }
        
        .audio-hidden {
            position: absolute;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <canvas class="matrix-bg" id="matrix"></canvas>
    <div class="particles" id="particles"></div>
    
    <div class="glitch">Ha2ked By Riven</div>
    
    <div class="terminal">
        <div class="terminal-header">
            <span>SYSTEM COMPROMISED - TERMINAL ACCESS</span>
            <div class="terminal-buttons">
                <div class="terminal-button"></div>
                <div class="terminal-button"></div>
                <div class="terminal-button"></div>
            </div>
        </div>
        
        <div class="terminal-content">
            <div class="command-line">
                <span class="cursor"></span>
                <span class="prompt">root@target:~#</span>
                <span class="command"> ./exploit.sh --execute</span>
            </div>
            <div class="command-line">
                <span class="status">[+] Scanning network vulnerabilities...</span>
            </div>
            <div class="command-line">
                <span class="status">[+] Firewall bypassed successfully</span>
            </div>
            <div class="command-line">
                <span class="status">[+] Escalating privileges...</span>
            </div>
            <div class="command-line">
                <span class="status">[+] Root access granted</span>
            </div>
            <div class="command-line">
                <span class="command">$ whoami</span>
            </div>
            <div class="command-line">
                <span class="status">Riven - Elite Hacker</span>
            </div>
            <div class="command-line">
                <span class="command">$ cat /etc/message</span>
            </div>
            <div class="command-line">
                <span class="status">System successfully compromised by Riven</span>
            </div>
        </div>
    </div>
    
    <!-- مشغل الصوت المخفي -->
    <audio class="audio-hidden" autoplay loop>
